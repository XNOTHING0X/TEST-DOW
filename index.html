<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Speed Test - NOTHING_X</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #ff1a1a;
    text-align: center;
  }
  .taskbar-wrapper {
    position: relative;
    width: 90vw;
    max-width: 700px;
    margin: 20px 0;
    height: 40px;
  }
  .taskbar {
    width: 100%;
    height: 100%;
    background: #111;
    border: 1px solid #333;
    overflow: hidden;
    position: relative;
  }
  .fill {
    height: 100%;
    width: 0%;
    background: #ff1a1a;
    transition: width 0.05s linear;
  }
  .speed-label {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: bold; font-size: 1.3rem;
    pointer-events: none; z-index: 2;
  }
  .marker {
    position: absolute; top: 0; width: 1px; height: 100%;
    background: #555; z-index: 1; transform: translateX(-50%);
  }
  .status {
    color: #ff1a1a; font-size: 1.2rem; margin: 10px 0;
    opacity: 0; transition: opacity 0.3s;
  }
  .status.show { opacity: 1; }
  .result {
    color: #ff1a1A; font-size: 1.6rem; font-weight: bold;
    opacity: 0; transition: opacity 0.3s; margin: 15px 0;
    line-height: 1.5;
  }
  .result.show { opacity: 1; }
  .btn {
    padding: 12px 32px; font-size: 1.1rem; font-weight: bold;
    color: #ff1a1a; background: transparent; border: 1px solid #ff1a1a;
    cursor: pointer; transition: all 0.2s; margin: 8px;
  }
  .btn:hover { background: #ff1a1a; color: #000; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<button class="btn" id="startBtn">Start Test :)</button>
<div class="status" id="status"></div>
<div class="taskbar-wrapper hidden" id="taskbarWrapper">
  <div class="taskbar" id="taskbar">
    <div class="fill" id="fill"></div>
    <div class="speed-label" id="speedLabel">0.00 Mbps</div>
  </div>
</div>
<div class="result" id="result"></div>
<button class="btn hidden" id="restBtn">Reset</button>
<script>
  const startBtn = document.getElementById('startBtn');
  const status = document.getElementById('status');
  const taskbarWrapper = document.getElementById('taskbarWrapper');
  const fill = document.getElementById('fill');
  const speedLabel = document.getElementById('speedLabel');
  const result = document.getElementById('result');
  const restBtn = document.getElementById('restBtn');
  
  const TEST_DURATION = 20000;
  const WAIT_BETWEEN = 4000; 
  const TEST_FILE_SIZE = 3000 * 1024 * 1024;
  const MAX_SCALE = 260;

  let isTesting = false;
  let reader;
  let animationId;
  let currentServer = null;
  let results = [];

  const SERVERS = [
    {
      name: "Google",
      pingUrl: "https://www.google.com/favicon.ico",
      downloadUrl: "https://storage.googleapis.com/web-dev-uploads/image/WBNkY2p7O4.png"
    },
    {
      name: "Cloudflare",
      pingUrl: "https://speed.cloudflare.com/__down",
      downloadUrl: "https://speed.cloudflare.com/__down"
    }
  ];

  function createMarkers() {
    taskbarWrapper.querySelectorAll('.marker').forEach(m => m.remove());
    for (let i = 10; i <= MAX_SCALE; i += 10) {
      const percent = (i / MAX_SCALE) * 100;
      const marker = document.createElement('div');
      marker.classList.add('marker');
      marker.style.left = percent + '%';
      taskbarWrapper.appendChild(marker);
    }
  }

  async function measurePing(server) {
    status.textContent = `Ping: ${server.name}...`;
    status.classList.add('show');
    const start = performance.now();
    try {
      const controller = new AbortController();
      setTimeout(() => controller.abort(), 5000);
      await fetch(server.pingUrl + '?_=' + Date.now(), {
        method: 'GET',
        mode: 'no-cors',
        cache: 'no-store',
        signal: controller.signal
      });
      const ping = Math.round(performance.now() - start);
      return ping < 10000 ? `${ping} ms` : "Timeout";
    } catch {
      return "Timeout";
    }
  }

  async function runDownloadTest(server) {
    status.textContent = `Pobieranie: ${server.name}...`;
    let received = 0;
    let maxSpeed = 0;
    const startTime = performance.now();
    taskbarWrapper.classList.remove('hidden');
    fill.style.width = '0%';
    speedLabel.textContent = '0.00 Mbps';
    createMarkers();

    const url = server.name === "Cloudflare"
      ? `${server.downloadUrl}?bytes=${TEST_FILE_SIZE}&_=${Date.now()}`
      : `https://speed.cloudflare.com/__down?bytes=${TEST_FILE_SIZE}&_=${Date.now()}`;

    try {
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) throw new Error("Błąd sieci");
      reader = response.body.getReader();

      const updateSpeed = () => {
        const now = performance.now();
        const elapsed = (now - startTime) / 1000;
        if (elapsed === 0) return;
        const speed = (received * 8) / (elapsed * 1000000);
        speedLabel.textContent = speed.toFixed(2) + ' Mbps';
        const percent = Math.min((speed / MAX_SCALE) * 100, 100);
        fill.style.width = percent + '%';
        if (speed > maxSpeed) maxSpeed = speed;
        if (isTesting && (now - startTime) < TEST_DURATION) {
          animationId = requestAnimationFrame(updateSpeed);
        }
      };

      const read = async () => {
        const { done, value } = await reader.read();
        if (done) return;
        received += value.length;
        if (isTesting) {
          read();
          updateSpeed();
        }
      };

      read();
      animationId = requestAnimationFrame(updateSpeed);
      await new Promise(resolve => setTimeout(resolve, TEST_DURATION));
      cancelAnimationFrame(animationId);
      reader.cancel();

      const finalSpeed = (received * 8) / (TEST_DURATION / 1000 * 1000000);
      return Math.max(finalSpeed, maxSpeed);
    } catch (e) {
      console.error(e);
      return 0;
    }
  }

  startBtn.onclick = async () => {
    if (isTesting) return;
    startBtn.classList.add('hidden');
    isTesting = true;
    results = [];
    status.classList.add('show');
    taskbarWrapper.classList.add('hidden');
    result.classList.remove('show');

    for (let i = 0; i < SERVERS.length; i++) {
      const server = SERVERS[i];
      currentServer = server;


      const ping = await measurePing(server);


      const speed = await runDownloadTest(server);

      results.push({ name: server.name, speed: speed.toFixed(2), ping });


      taskbarWrapper.classList.add('hidden');


      if (i < SERVERS.length - 1) {
        status.textContent = `....`;
        await new Promise(r => setTimeout(r, WAIT_BETWEEN));
      }
    }


    const best = results.reduce((a, b) => parseFloat(a.speed) > parseFloat(b.speed) ? a : b);
    result.innerHTML = `
      <strong>Google:</strong> ${results[0].speed} Mbps | Ping: ${results[0].ping}<br>
      <strong>Cloudflare:</strong> ${results[1].speed} Mbps | Ping: ${results[1].ping}<br><br>
      <strong>The Best: ${best.name} (${best.speed} Mbps)</strong>
    `;
    result.classList.add('show');
    status.classList.remove('show');
    restBtn.classList.remove('hidden');
    isTesting = false;
  };


  restBtn.onclick = () => {
    isTesting = false;
    if (animationId) cancelAnimationFrame(animationId);
    if (reader) reader.cancel();
    taskbarWrapper.classList.add('hidden');
    result.classList.remove('show');
    status.classList.remove('show');
    restBtn.classList.add('hidden');
    startBtn.classList.remove('hidden');
    fill.style.width = '0%';
    speedLabel.textContent = '0.00 Mbps';
  };
</script>
</body>
</html>
