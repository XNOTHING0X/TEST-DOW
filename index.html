<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Speed Test - NOTHING_X</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#000;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
font-family:'Courier New',monospace;
color:#ff1a1a;
text-align:center
}
.taskbar-wrapper{
position:relative;
width:90vw;
max-width:700px;
margin:20px 0;
height:40px
}
.taskbar{
width:100%;
height:100%;
background:#111;
border:1px solid #333;
overflow:hidden;
border-radius:12px
}
.fill{
height:100%;
width:0%;
background:#ff1a1a;
transition:width .05s linear;
border-radius:12px
}
.speed-label{
position:absolute;
top:0;left:0;
width:100%;height:100%;
display:flex;
align-items:center;
justify-content:center;
color:#fff;
font-weight:bold;
font-size:1.3rem;
pointer-events:none;
z-index:2
}
.marker{
position:absolute;
top:0;
width:2px;
height:100%;
background:#555;
z-index:1;
transform:translateX(-50%)
}
.status{
color:#ff1a1a;
font-size:1.2rem;
margin:10px 0;
opacity:0;
transition:opacity .3s
}
.status.show{opacity:1}
.result{
color:#ff1a1a;
font-size:1.6rem;
font-weight:bold;
opacity:0;
transition:opacity .3s;
margin:15px 0;
line-height:1.5
}
.result.show{opacity:1}
.btn{
padding:12px 32px;
font-size:1.1rem;
font-weight:bold;
color:#ff1a1a;
background:transparent;
border:1px solid #ff1a1a;
cursor:pointer;
transition:.2s;
margin:8px;
border-radius:12px
}
.btn:hover{
background:#ff1a1a;
color:#000
}
.btn:disabled{
opacity:.5;
cursor:not-allowed
}
.hidden{display:none!important}
</style>
</head>
<body>
<button class="btn" id="startBtn">Start Test :)</button>
<div class="status" id="status"></div>
<div class="taskbar-wrapper hidden" id="taskbarWrapper">
<div class="taskbar" id="taskbar">
<div class="fill" id="fill"></div>
<div class="speed-label" id="speedLabel">0.00 Mbps</div>
</div>
</div>
<div class="result" id="result"></div>
<button class="btn hidden" id="restBtn">Reset</button>

<script>
const startBtn = document.getElementById('startBtn');
const status = document.getElementById('status');
const taskbarWrapper = document.getElementById('taskbarWrapper');
const fill = document.getElementById('fill');
const speedLabel = document.getElementById('speedLabel');
const result = document.getElementById('result');
const restBtn = document.getElementById('restBtn');

const TEST_DURATION = 17001;
const CHUNK_SIZE = 1000 * 1024 * 1024;
const MAX_SCALE = 259;
const PARALLEL_CONNECTIONS = 766;

let isTesting = false;
let animationId = null;
let totalReceived = 0;
let maxSpeed = 0;
let startTime = 0;
let lastFrameTime = 0;
let controllers = [];

function createMarkers() {
    taskbarWrapper.querySelectorAll('.marker').forEach(m => m.remove());
    for (let i = 10; i <= MAX_SCALE; i += 10) {
        const percent = (i / MAX_SCALE) * 100;
        const marker = document.createElement('div');
        marker.classList.add('marker');
        marker.style.left = percent + '%';
        taskbarWrapper.appendChild(marker);
    }
}

async function measurePing() {
    const start = performance.now();
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 3000);
    try {
        await fetch("https://www.google.com/favicon.ico?_=" + Date.now(), {
            method: 'GET',
            mode: 'no-cors',
            cache: 'no-store',
            signal: controller.signal
        });
        clearTimeout(timeout);
        const ping = Math.round(performance.now() - start);
        return ping < 3000 ? ping + " ms" : "Timeout";
    } catch {
        clearTimeout(timeout);
        return "Timeout";
    }
}

async function runDownloadTest() {
    totalReceived = 0;
    maxSpeed = 0;
    startTime = performance.now();
    lastFrameTime = startTime;
    taskbarWrapper.classList.remove('hidden');
    fill.style.width = '0%';
    speedLabel.textContent = '0.00 Mbps';
    createMarkers();

    const servers = [
        'https://speed.cloudflare.com/__down?bytes=',
        'https://storage.googleapis.com/public-bucket-1gb/__down?bytes=',
        'https://cdn.fastly.io/test/__down?bytes='
    ];

    const promises = [];
    controllers = [];

    for (let i = 0; i < PARALLEL_CONNECTIONS; i++) {
        const controller = new AbortController();
        controllers.push(controller);
        const url = `${servers[i % servers.length]}${CHUNK_SIZE}&_=${Date.now()}`;
        promises.push(downloadChunk(url, controller.signal));
    }

    setTimeout(() => controllers.forEach(c => c.abort()), TEST_DURATION);

    await Promise.race([Promise.allSettled(promises), new Promise(r => setTimeout(r, TEST_DURATION))]);
    controllers.forEach(c => c.abort());
    controllers = [];

    return maxSpeed;
}

async function downloadChunk(url, signal) {
    try {
        const response = await fetch(url, { cache: 'no-store', signal });
        if (!response.ok) return;
        const reader = response.body.getReader();
        while (true) {
            const { done, value } = await reader.read();
            if (done || !isTesting) break;
            totalReceived += value.length;
            updateSpeed();
        }
    } catch (e) {
        // ciche błędy
    }
}

function updateSpeed() {
    const now = performance.now();
    if (now - lastFrameTime < 16) return;
    lastFrameTime = now;

    const elapsed = (now - startTime) / 1000;
    if (elapsed === 0) return;

    const speed = (totalReceived * 8) / (elapsed * 1000000);
    speedLabel.textContent = speed.toFixed(2) + ' Mbps';
    const percent = Math.min((speed / MAX_SCALE) * 100, 100);
    fill.style.width = percent + '%';

    if (speed > maxSpeed) maxSpeed = speed;

    if (isTesting && (now - startTime) < TEST_DURATION) {
        animationId = requestAnimationFrame(updateSpeed);
    }
}

startBtn.onclick = async () => {
    if (isTesting) return;
    isTesting = true;
    startBtn.classList.add('hidden');
    status.classList.add('show');
    result.classList.remove('show');
    restBtn.classList.add('hidden');

    status.textContent = "Mierzenie ping...";
    const ping = await measurePing();
    status.textContent = "Pobieranie danych...";

    const speed = await runDownloadTest();

    taskbarWrapper.classList.add('hidden');
    result.innerHTML = `Ping: ${ping}<br>Download: ${speed.toFixed(2)} Mbps`;
    result.classList.add('show');
    status.classList.remove('show');
    restBtn.classList.remove('hidden');
    isTesting = false;
};

restBtn.onclick = () => {
    isTesting = false;
    if (animationId) cancelAnimationFrame(animationId);
    controllers.forEach(c => c.abort());
    controllers = [];
    taskbarWrapper.classList.add('hidden');
    result.classList.remove('show');
    status.classList.remove('show');
    restBtn.classList.add('hidden');
    startBtn.classList.remove('hidden');
    fill.style.width = '0%';
    speedLabel.textContent = '0.00 Mbps';
};
</script>
</body>
</html>
